[tool.poetry]
name = "aimaginator"
version = "0.1.0"
description = "AImaginator — API + web app de geracao e edicao de imagens via IA (monolito modular, Clean Architecture)"
authors = ["ViChagas07"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<=3.13"

# --- API ---
fastapi = "^0.162.2"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
python-multipart = ">=0.0.20,<0.1"   # uploads (edicao de imagem; CVEs antigas)
sse-starlette = "^2.1.3"      # Server-Sent Events

# --- Persistencia / storage ---
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = ">=0.29,<0.33"
alembic = "^1.13.0"
boto3 = ">=1.35,<2"

# --- Recursos do host (guarda de RAM antes do sd-cli) ---
psutil = ">=6,<8"

# --- Imagem: marca d'agua, metadados e upscale Lanczos ---
pillow = ">=13,<14"

# --- Cache ---
redis = "^5.0.8"

# --- Mensageria ---
celery = { extras = ["redis"], version = "^5.4.0" }
kombu = "^5.4.0"              # RabbitMQ via amqp

# --- Auth (OAuth2 + OIDC) ---
authlib = ">=1.9.1,<2"
aiohttp = ">=3.14.4,<4"
certifi = ">=2026.10.18"
joserfc = ">=1.7.6,<2"
itsdangerous = "^2.2.0"       # cookies de sessao assinados
httpx = "^0.27.2"             # client HTTP async (OIDC, provedores)

# --- Agentes de IA ---
# langgraph e lazy/opcional; o pipeline tem fallback sequencial.
langgraph = "^1.2.20"

# --- Observabilidade ---
prometheus-client = "^0.20.0"
sentry-sdk = { extras = ["fastapi", "celery"], version = "^2.14.0" }
structlog = "^24.4.0"
starlette = "^1.10.0"

[tool.poetry.group.moderation]
optional = true

[tool.poetry.group.moderation.dependencies]
torch = ">=2.2,<3"
transformers = ">=4.40,<5"

[tool.poetry.group.provenance]
optional = true

[tool.poetry.group.provenance.dependencies]
c2pa-python = ">=0.6,<1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
hypothesis = "^6.112.0"       # property-based testing (inputs adversariais)
respx = "^0.21.1"             # mock de httpx
fakeredis = "^2.24.0"         # redis em memoria para testes
lupa = ">=2.0,<3"             # Lua no fakeredis (TokenBucket)
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "modules"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "unit: testes unitarios puros",
    "integration: testes de integracao (db/redis fake)",
    "eval: avaliacoes EDD de agentes de IA",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # asserts em testes sao esperados

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"tests/unit/test_s3_storage.py" = ["N803"]  # kwargs da API boto3
"alembic/versions/**" = ["E501"]
"modules/auth/application/jwt_service.py" = ["S106"]
"modules/auth/application/oidc_service.py" = ["S105"]
"modules/rate_limiting/token_bucket.py" = ["S105"]
# Textos multilíngues contêm pontuação/vocabulário não latino intencional.
"modules/image_generation/application/localization.py" = ["E501", "RUF001"]
"modules/image_generation/application/services/prompt_assistant.py" = [
    "E501",
    "RUF001",
]  # token especial de raciocínio do Qwen
"specs/evals/prompt_assistant_eval.py" = ["E501", "RUF001"]  # casos multilíngues

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["apps/web/", ".venv/"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
