# Prometheus — configuracao de scrape da API AImaginator.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "aimaginator-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "aimaginator-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
